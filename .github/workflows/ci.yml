name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          REQUIREMENTS=$(find . -type f -name "requirements.txt" | head -n 1)

          if [ -n "$REQUIREMENTS" ]; then
            echo "requirements.txt found at: $REQUIREMENTS"
            pip install -r "$REQUIREMENTS"
          else
            echo "requirements.txt not found."
            echo "Installing minimum required packages."
            pip install flask pytest requests
          fi

      - name: Validate Python code
        run: |
          python -m compileall .

      - name: Run tests
        shell: bash
        run: |
          if [ -d test ]; then
            pytest test
          elif [ -d tests ]; then
            pytest tests
          else
            echo "No test folder found. Skipping tests."
          fi

      - name: Validate Docker Compose
        shell: bash
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          elif [ -f docker-compose.yaml ]; then
            docker compose -f docker-compose.yaml config
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config
          elif [ -f compose.yaml ]; then
            docker compose -f compose.yaml config
          else
            echo "No Docker Compose file found. Skipping validation."
          fi

      - name: Find Dockerfile
        id: docker
        shell: bash
        run: |
          DOCKERFILE=$(find . -type f -name "Dockerfile" | head -n 1)

          if [ -z "$DOCKERFILE" ]; then
            echo "ERROR: Dockerfile not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          DOCKERFILE="${DOCKERFILE#./}"
          DOCKER_CONTEXT=$(dirname "$DOCKERFILE")

          echo "Dockerfile found at: $DOCKERFILE"
          echo "Docker build context: $DOCKER_CONTEXT"

          echo "DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"
          echo "DOCKER_CONTEXT=$DOCKER_CONTEXT" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t webapp:test \
            "$DOCKER_CONTEXT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR image name
        if: github.event_name == 'push'
        shell: bash
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Image: $IMAGE_NAME"

      - name: Build production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            "$DOCKER_CONTEXT"

      - name: Push latest Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:latest"

      - name: Push versioned Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: CI/CD completed
        run: |
          echo "======================================"
          echo "CI/CD pipeline completed successfully"
          echo "======================================"