name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          REQUIREMENTS=$(find . -type f -name "requirements.txt" | head -n 1)

          if [ -n "$REQUIREMENTS" ]; then
            echo "Found requirements file: $REQUIREMENTS"
            pip install -r "$REQUIREMENTS"
          else
            echo "requirements.txt not found."
            echo "Installing basic project dependencies."
            pip install flask pytest requests prometheus-client
          fi

      - name: Validate Python code
        shell: bash
        run: |
          echo "Checking Python files..."

          if find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            | grep -q .; then

            python -m compileall .

          else
            echo "No Python files found. Skipping validation."
          fi

      - name: Run tests
        shell: bash
        run: |
          if [ -d "test" ]; then
            echo "Running tests from test/"
            python -m pytest test

          elif [ -d "tests" ]; then
            echo "Running tests from tests/"
            python -m pytest tests

          else
            echo "No test directory found."
            echo "Skipping tests."
          fi

      - name: Find Docker Compose file
        id: compose
        shell: bash
        run: |
          COMPOSE_FILE=""

          if [ -f "docker-compose.yml" ]; then
            COMPOSE_FILE="docker-compose.yml"

          elif [ -f "docker-compose.yaml" ]; then
            COMPOSE_FILE="docker-compose.yaml"

          elif [ -f "compose.yml" ]; then
            COMPOSE_FILE="compose.yml"

          elif [ -f "compose.yaml" ]; then
            COMPOSE_FILE="compose.yaml"
          fi

          if [ -n "$COMPOSE_FILE" ]; then
            echo "Docker Compose file found: $COMPOSE_FILE"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No Docker Compose file found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Docker Compose
        if: steps.compose.outputs.found == 'true'
        run: |
          docker compose \
            -f "${{ steps.compose.outputs.file }}" \
            config

      - name: Find Dockerfile
        id: docker
        shell: bash
        run: |
          DOCKERFILE=$(find . \
            -type f \
            -iname "Dockerfile" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$DOCKERFILE" ]; then

            DOCKERFILE="${DOCKERFILE#./}"
            DOCKER_CONTEXT=$(dirname "$DOCKERFILE")

            echo "Dockerfile found: $DOCKERFILE"
            echo "Docker context: $DOCKER_CONTEXT"

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
            echo "context=$DOCKER_CONTEXT" >> "$GITHUB_OUTPUT"

          else

            echo "No Dockerfile found."
            echo "Docker build steps will be skipped."

            echo "found=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Build Docker image
        if: steps.docker.outputs.found == 'true'
        run: |
          docker build \
            -f "${{ steps.docker.outputs.dockerfile }}" \
            -t webapp:test \
            "${{ steps.docker.outputs.context }}"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && steps.docker.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR image name
        if: github.event_name == 'push' && steps.docker.outputs.found == 'true'
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Image name:"
          echo "$IMAGE_NAME"

      - name: Build production Docker image
        if: github.event_name == 'push' && steps.docker.outputs.found == 'true'
        run: |
          docker build \
            -f "${{ steps.docker.outputs.dockerfile }}" \
            -t "${{ steps.image.outputs.image }}:latest" \
            -t "${{ steps.image.outputs.image }}:${{ github.sha }}" \
            "${{ steps.docker.outputs.context }}"

      - name: Push latest Docker image to GHCR
        if: github.event_name == 'push' && steps.docker.outputs.found == 'true'
        run: |
          docker push "${{ steps.image.outputs.image }}:latest"

      - name: Push versioned Docker image to GHCR
        if: github.event_name == 'push' && steps.docker.outputs.found == 'true'
        run: |
          docker push "${{ steps.image.outputs.image }}:${{ github.sha }}"

      - name: CI/CD completed
        run: |
          echo "======================================"
          echo "CI/CD pipeline completed successfully"
          echo "======================================"