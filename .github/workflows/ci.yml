name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build Docker image
        run: |
          docker build -t production-webapp:test .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/end-to-end-dockerized-web-application:latest \
            .

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/end-to-end-dockerized-web-application:latest

      - name: Post Set up Python
        if: always()
        run: |
          echo "CI/CD pipeline completed."