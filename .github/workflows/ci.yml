name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found."
            pip install flask pytest requests prometheus-client
          fi

          pip install pytest

      - name: Validate Python code
        run: |
          python -m compileall .

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d test ]; then
            python -m pytest test -v
          elif [ -d tests ]; then
            python -m pytest tests -v
          else
            echo "No test directory found. Skipping tests."
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config
          elif [ -f docker-compose.yaml ]; then
            docker compose -f docker-compose.yaml config
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config
          elif [ -f compose.yaml ]; then
            docker compose -f compose.yaml config
          else
            echo "No Docker Compose file found. Skipping validation."
          fi

      - name: Check Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile found."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile not found."
            echo "Docker build will be skipped."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.dockerfile.outputs.found == 'true'
        run: |
          docker build -t webapp:test .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && steps.dockerfile.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        if: github.event_name == 'push' && steps.dockerfile.outputs.found == 'true'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

          echo "Docker image:"
          echo "$IMAGE_NAME"

      - name: Build production Docker image
        if: github.event_name == 'push' && steps.dockerfile.outputs.found == 'true'
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Push latest Docker image
        if: github.event_name == 'push' && steps.dockerfile.outputs.found == 'true'
        run: |
          docker push "$IMAGE_NAME:latest"

      - name: Push versioned Docker image
        if: github.event