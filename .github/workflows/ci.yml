name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
          fi

      - name: Validate Python code
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config
          else
            echo "No Docker Compose file found. Skipping validation."
          fi

      - name: Find Dockerfile
        run: |
          DOCKERFILE=$(find . -type f -name "Dockerfile" | head -n 1)

          if [ -z "$DOCKERFILE" ]; then
            echo "ERROR: Dockerfile not found!"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          DOCKERFILE="${DOCKERFILE#./}"
          DOCKER_DIR=$(dirname "$DOCKERFILE")

          echo "Dockerfile found at: $DOCKERFILE"
          echo "Docker build context: $DOCKER_DIR"

          echo "DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"
          echo "DOCKER_DIR=$DOCKER_DIR" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t webapp:test \
            "$DOCKER_DIR"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR image name
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Image name: $IMAGE_NAME"

      - name: Build production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            "$DOCKER_DIR"

      - name: Push latest Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:latest"

      - name: Push versioned Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: CI/CD completed
        run: |
          echo "CI/CD pipeline completed successfully."