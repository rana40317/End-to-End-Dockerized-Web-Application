name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found."
            pip install flask pytest requests prometheus-client
          fi

      - name: Validate Python code
        shell: bash
        run: |
          python -m compileall .

      - name: Validate Docker Compose
        shell: bash
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config
          elif [ -f docker-compose.yaml ]; then
            docker compose -f docker-compose.yaml config
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config
          elif [ -f compose.yaml ]; then
            docker compose -f compose.yaml config
          else
            echo "No Docker Compose file found. Skipping."
          fi

      - name: Build Docker image
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            docker build -t webapp:test .
          else
            echo "Dockerfile not found. Skipping Docker build."
          fi

      - name: Login and push image to GHCR
        if: github.event_name == 'push'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found. Skipping GHCR push."
            exit 0
          fi

          IMAGE_NAME="ghcr.io/$REPOSITORY"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin

          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$COMMIT_SHA" \
            .

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$COMMIT_SHA"

      - name: CI/CD completed
        run: |
          echo "======================================"
          echo "CI/CD pipeline completed successfully"
          echo "======================================"