name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Display repository structure
      - name: Check repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 3 -type f

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "Found requirements.txt in repository root"
            pip install -r requirements.txt

          elif [ -f "app/requirements.txt" ]; then
            echo "Found requirements.txt inside app directory"
            pip install -r app/requirements.txt

          else
            echo "requirements.txt not found"
            echo "Installing basic project dependencies"
            pip install flask gunicorn prometheus-client pytest
          fi

      # 5. Run tests
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          elif find . -name "test_*.py" | grep -q .; then
            pytest
          else
            echo "No tests found. Skipping tests."
          fi

      # 6. Validate Docker Compose
      - name: Validate Docker Compose
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose -f docker-compose.yml config --no-interpolate
          elif [ -f "compose.yml" ]; then
            docker compose -f compose.yml config --no-interpolate
          else
            echo "Docker Compose file not found. Skipping validation."
          fi

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t production-webapp:test .

      # 8. Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Prepare GHCR image name
      - name: Set image name
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 10. Build production Docker image
      - name: Build Production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      # 11. Push Docker image to GHCR
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}