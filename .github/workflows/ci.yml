name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Show project structure
      # --------------------------------------------------
      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository structure:"
          find . -maxdepth 3 -type f

      # --------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "Using root requirements.txt"
            pip install -r requirements.txt

          elif [ -f "app/requirements.txt" ]; then
            echo "Using app/requirements.txt"
            pip install -r app/requirements.txt

          else
            echo "requirements.txt not found"
            echo "Installing required packages"
            pip install flask gunicorn prometheus-client pytest
          fi

      # --------------------------------------------------
      # 5. Python syntax validation
      # --------------------------------------------------
      - name: Validate Python code
        run: |
          python -m compileall app || true

      # --------------------------------------------------
      # 6. Run tests if compatible
      # --------------------------------------------------
      - name: Run tests
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d "test" ]; then
            echo "Running tests from test/"
            pytest test/ -v
          elif [ -d "tests" ]; then
            echo "Running tests from tests/"
            pytest tests/ -v
          else
            echo "No test directory found."
          fi

      # --------------------------------------------------
      # 7. Validate Docker Compose
      # --------------------------------------------------
      - name: Validate Docker Compose
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose -f docker-compose.yml config --no-interpolate

          elif [ -f "docker-compose.yaml" ]; then
            docker compose -f docker-compose.yaml config --no-interpolate

          elif [ -f "compose.yml" ]; then
            docker compose -f compose.yml config --no-interpolate

          elif [ -f "compose.yaml" ]; then
            docker compose -f compose.yaml config --no-interpolate

          else
            echo "No Docker Compose file found."
            echo "Skipping Docker Compose validation."
          fi

      # --------------------------------------------------
      # 8. Verify Dockerfile
      # --------------------------------------------------
      - name: Check Dockerfile
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "ERROR: Dockerfile not found!"
            exit 1
          fi

          echo "Dockerfile found."

      # --------------------------------------------------
      # 9. Build test Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t production-webapp:test \
            .

      # --------------------------------------------------
      # 10. Login to GitHub Container Registry
      # --------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 11. Set GHCR image name
      # --------------------------------------------------
      - name: Set image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Docker image: $IMAGE_NAME"

      # --------------------------------------------------
      # 12. Build production image
      # --------------------------------------------------
      - name: Build Production Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      # --------------------------------------------------
      # 13. Push latest image
      # --------------------------------------------------
      - name: Push latest Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:latest"

      # --------------------------------------------------
      # 14. Push commit-specific image
      # --------------------------------------------------
      - name: Push versioned Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"

      # --------------------------------------------------
      # 15. Pipeline completion
      # --------------------------------------------------
      - name: CI/CD completed
        run: |
          echo "======================================"
          echo "CI/CD pipeline completed successfully"
          echo "======================================"