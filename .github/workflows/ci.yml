name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Validate Python code
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          if [ -d test ]; then
            pytest test
          elif [ -d tests ]; then
            pytest tests
          else
            echo "No test directory found. Skipping tests."
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          elif [ -f docker-compose.yaml ]; then
            docker compose -f docker-compose.yaml config
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config
          elif [ -f compose.yaml ]; then
            docker compose -f compose.yaml config
          else
            echo "No Docker Compose file found. Skipping validation."
          fi

      - name: Check Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found in repository root."
            echo "Please add Dockerfile to the root of the repository."
            exit 1
          fi

          echo "Dockerfile found successfully."

      - name: Build Docker image
        run: |
          docker build -t webapp:test .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GHCR image name
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Image name: $IMAGE_NAME"

      - name: Build production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Push latest Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:latest"

      - name: Push versioned Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: CI/CD completed
        run: |
          echo "======================================"
          echo "CI/CD pipeline completed successfully"
          echo "======================================"