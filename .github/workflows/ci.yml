name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------
      # 3. Install Python dependencies
      # ---------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------
      # 4. Run tests
      # ---------------------------------------------------
      - name: Run tests
        run: |
          pytest

      # ---------------------------------------------------
      # 5. Validate Docker Compose
      # ---------------------------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose config

      # ---------------------------------------------------
      # 6. Build Docker image for validation
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t production-webapp:test .

      # ---------------------------------------------------
      # 7. Login to GitHub Container Registry
      # Only run when code is pushed to main
      # ---------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # 8. Build production Docker image
      # ---------------------------------------------------
      - name: Build Production Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/end-to-end-dockerized-web-application:latest \
            .

      # ---------------------------------------------------
      # 9. Push Docker image to GHCR
      # ---------------------------------------------------
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/end-to-end-dockerized-web-application:latest